services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  server:
    build:
      context: .
      target: server
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      MEDIA_DIR: /app/media
      ADMIN_URL: ${ADMIN_URL:-http://admin.localhost:8787}
      SUPPORT_URL: ${SUPPORT_URL:-http://support.localhost:8787}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      MOCK_MODE: ${MOCK_MODE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8000/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - media-data:/app/media

  admin:
    build:
      context: .
      target: admin
      args:
        SERVER_INTERNAL_URL: http://server:8000
    environment:
      SERVER_INTERNAL_URL: http://server:8000
    depends_on:
      server:
        condition: service_healthy

  support:
    build:
      context: .
      target: support
      args:
        SERVER_INTERNAL_URL: http://server:8000
    environment:
      SERVER_INTERNAL_URL: http://server:8000
    depends_on:
      server:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      ADMIN_ADDRESS: ${ADMIN_ADDRESS:-http://admin.localhost}
      SUPPORT_ADDRESS: ${SUPPORT_ADDRESS:-http://support.localhost}
    ports:
      - "${APP_PORT:-8787}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
      admin:
        condition: service_started
      support:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  media-data:
  caddy-data:
  caddy-config:
